name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# This builds the sdist + wheel, attaches them to a GitHub Release, and prints
# the SHA256 of the tag's source tarball — the value the Homebrew formula's
# `sha256` field needs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Run tests against the built package
        run: |
          python -m pip install "$(ls dist/*.whl)[dev]"
          python -m pip install pytest
          python -m pytest -q

      - name: Compute Homebrew source-tarball SHA256
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          echo "Fetching $URL"
          SHA="$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')"
          echo "Homebrew url:    $URL"
          echo "Homebrew sha256: $SHA"
          {
            echo "### Homebrew formula values"
            echo ""
            echo '```ruby'
            echo "url \"$URL\""
            echo "sha256 \"$SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
